name: Build NanoBoyAdvance (Windows ARM64/AArch64)

on:
  push:
    branches:
      - master

jobs:
  build-winarm64:
    defaults:
      run:
        shell: msys2 {0}
    runs-on: windows-11-arm
    steps:
      - name: Set git to use LF
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          pacboy: >-
            cmake:p
            ninja:p
            python-jinja:p
            python-lxml:p
            qt5-static:p
            SDL2:p
            toolchain:p
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DPLATFORM_QT_STATIC=ON -DPython_EXECUTABLE="$MSYSTEM_PREFIX/bin/python3" -DUSE_STATIC_SDL=ON
          cmake --build build
      - name: Copy files
        run: |
          cd build
          mkdir upload
          cp ../LICENSE upload/license.txt
          cp bin/qt/{config.toml,NanoBoyAdvance.exe} upload
          strip upload/NanoBoyAdvance.exe
      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NanoBoyAdvance-git-winarm64-${{github.sha}}
          path: build/upload
          if-no-files-found: error
